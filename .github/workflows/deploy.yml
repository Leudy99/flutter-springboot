# Despliegue automatico: cada push a main construye el backend y actualiza AWS con Terraform.
#
#   push a main -> pruebas -> zip de Lambda -> terraform plan/apply -> AWS actualizado
#
# Todos los valores sensibles salen de GitHub Secrets (Settings > Secrets and variables > Actions).
# GitHub los oculta en los logs (***) y Terraform los marca como "sensitive".

name: Deploy Serverless

on:
  push:
    branches: [main]
  # Permite lanzarlo a mano desde la pestana Actions
  workflow_dispatch:

# Solo lectura del repositorio
permissions:
  contents: read

# Nunca dos despliegues a la vez sobre la misma infraestructura
concurrency:
  group: deploy-aws
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      # Variables de Terraform (TF_VAR_<nombre> = variable <nombre> de variables.tf)
      TF_VAR_aws_region: ${{ secrets.AWS_REGION }}
      TF_VAR_database_url: ${{ secrets.DATABASE_URL }}
      TF_VAR_database_username: ${{ secrets.DATABASE_USERNAME }}
      TF_VAR_database_password: ${{ secrets.DATABASE_PASSWORD }}
      TF_VAR_jwt_secret: ${{ secrets.JWT_SECRET }}
      # Terraform sin preguntas interactivas
      TF_INPUT: "false"
      TF_IN_AUTOMATION: "true"

    steps:
      # 1. Descargar el codigo del repositorio
      - name: Checkout
        uses: actions/checkout@v7

      # 2. Instalar Java 17 (con cache de las dependencias de Maven)
      - name: Configurar Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      # 3. Descargar las dependencias del backend
      - name: Instalar dependencias
        working-directory: backend
        run: ./mvnw -B -q dependency:go-offline

      # 4. Pruebas unitarias (si fallan, no se despliega nada)
      - name: Ejecutar pruebas
        working-directory: backend
        run: ./mvnw -B test

      # 5 y 6. Compilar el backend y generar el zip para Lambda
      - name: Construir backend y empaquetar Lambda
        working-directory: backend
        run: |
          ./mvnw -B -Plambda -DskipTests package
          ls -lh target/api-springboot-lambda.zip

      # 7. Credenciales de AWS (usuario IAM terraform-deploy)
      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Instalar Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.16.5"
          terraform_wrapper: false

      # 8. Terraform: init -> validate -> plan -> apply
      - name: Terraform init
        working-directory: terraform
        run: terraform init

      - name: Terraform validate
        working-directory: terraform
        run: terraform validate

      - name: Terraform plan
        working-directory: terraform
        run: terraform plan -out=tfplan

      # Aplica exactamente lo que mostro el plan
      - name: Terraform apply
        working-directory: terraform
        run: terraform apply -auto-approve tfplan

      - name: URL de la API
        working-directory: terraform
        run: |
          echo "API Gateway: $(terraform output -raw api_url)"
          echo "### API desplegada: $(terraform output -raw api_url)" >> "$GITHUB_STEP_SUMMARY"
