spring.application.name=api-springboot
# 8080 lo ocupa el contenedor pgadmin4, por eso usamos 8081
server.port=8081

# --- Conexion a PostgreSQL ---
# Sintaxis ${VARIABLE:respaldo}: usa la variable de entorno si existe,
# y si no, el valor que va despues de los dos puntos.
# - En AWS Lambda: las variables apuntan a Neon (PostgreSQL en la nube).
# - En local: sin variables, usa el PostgreSQL de docker-compose (puerto 5434).
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5434/apidb}
spring.datasource.username=${DATABASE_USERNAME:alumno}
spring.datasource.password=${DATABASE_PASSWORD:123456}
spring.datasource.driver-class-name=org.postgresql.Driver
# Conexiones abiertas a la vez. En Lambda cada instancia atiende una peticion
# a la vez, asi que basta con 2 (se configura con DB_POOL_SIZE).
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}

# --- Esquema de la base de datos ---
# Flyway crea las tablas con los scripts de db/migration (V1, V2...)
# Hibernate solo comprueba que las entidades coinciden con las tablas.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# --- JPA / Hibernate ---
spring.jpa.show-sql=${SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# --- JWT ---
# Clave de firma. Minimo 32 caracteres (HMAC-SHA).
# Se toma de la variable de entorno JWT_SECRET; el valor tras ':' es el de respaldo.
jwt.secret=${JWT_SECRET:cambia-esta-clave-por-una-propia-de-32-caracteres-minimo}
# Duracion del token en milisegundos: 3600000 = 1 hora
jwt.expiration=3600000

# --- Subida de archivos ---
# Donde se guardan: local (carpeta en disco) o s3 (bucket de AWS, en Lambda)
app.storage=${STORAGE:local}
# Modo local: carpeta (en Docker se monta como volumen)
app.upload-dir=${UPLOAD_DIR:uploads}
# Modo s3: nombre del bucket (lo define Terraform en la Lambda)
app.s3-bucket=${S3_BUCKET:}
# 4 MB: Lambda acepta peticiones de hasta 6 MB y el archivo viaja en base64 (+33 %)
spring.servlet.multipart.max-file-size=4MB
spring.servlet.multipart.max-request-size=5MB
