spring.application.name=api-springboot
# 8080 lo ocupa el contenedor pgadmin4, por eso usamos 8081
server.port=8081

# --- Conexion a PostgreSQL (corriendo en Docker) ---
# Sintaxis ${VARIABLE:respaldo}: usa la variable de entorno si existe,
# y si no, el valor que va despues de los dos puntos.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/apidb}
spring.datasource.username=${DB_USER:alumno}
spring.datasource.password=${DB_PASSWORD:123456}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---
# update = crea y actualiza las tablas automaticamente a partir de las entidades
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# --- JWT ---
# Clave de firma. Minimo 32 caracteres (HMAC-SHA).
# Se toma de la variable de entorno JWT_SECRET; el valor tras ':' es el de respaldo.
jwt.secret=${JWT_SECRET:cambia-esta-clave-por-una-propia-de-32-caracteres-minimo}
# Duracion del token en milisegundos: 3600000 = 1 hora
jwt.expiration=3600000

# --- Subida de archivos ---
# Carpeta donde se guardan los archivos (en Docker se monta como volumen)
app.upload-dir=${UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
