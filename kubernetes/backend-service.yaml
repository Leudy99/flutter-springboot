# Acceso estable a los Pods del backend y reparto entre ellos.
# LoadBalancer: Docker Desktop lo publica en el PC, asi el navegador entra por
# http://localhost:30081
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  labels:
    app: backend
spec:
  type: LoadBalancer
  selector:
    app: backend
  ports:
    - port: 30081
      targetPort: 8081
