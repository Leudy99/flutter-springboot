# Acceso estable a los Pods del backend. NodePort: el navegador del PC entra por
# http://localhost:30081 (Docker Desktop publica los NodePort en localhost).
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  labels:
    app: backend
spec:
  type: NodePort
  selector:
    app: backend
  ports:
    - port: 8081
      targetPort: 8081
      nodePort: 30081
