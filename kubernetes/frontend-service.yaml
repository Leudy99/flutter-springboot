# Publica el frontend en el PC: http://localhost:30080
# (el navegador, desde ahi, llama al backend en http://localhost:30081)
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  labels:
    app: frontend
spec:
  type: LoadBalancer
  selector:
    app: frontend
  ports:
    - port: 30080
      targetPort: 80
